<!doctype html>
<meta charset="utf-8">
<title>Измерване: побира ли се отговорът в ЧЗВ (max-height: 170px)</title>
<!--
  ═══════════════════════════════════════════════════════════════════
  ЕДИН ВЪПРОС: `.faq-a` се отваря до `max-height: 170px` и има
  `overflow: hidden` (css/home.css:412-413). Няма скрол вътре. Значи
  всичко над 170px просто ИЗЧЕЗВА — мама не вижда края на отговора и
  нищо не ѝ подсказва, че има още.

  Тук се мери СТАТИЧНО: истинските отговори, истинските стилове, при
  ширина на тесен телефон. Никакво чакане, никаква анимация.
  Текстовете са преписани дума по дума от js/home.js:756-760 (FAQ) и
  js/home2.js:241-247 (НОВИ_FAQ).
  ═══════════════════════════════════════════════════════════════════
-->
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/home.css">
<style>
  body { margin: 0; }
  #сцена { width: 320px; }          /* най-тесният телефон, който гоним */
  #изход { font: 13px/1.7 monospace; white-space: pre; padding: 16px; }
</style>

<div id="сцена">
  <section class="faq"><div class="faq-list" id="списък"></div></section>
</div>
<div id="изход">мери…</div>

<script>
(function () {
  const ЧЗВ = [
    ['Трябва ли ми интернет?', 'Само първия път, за да се зареди. После работи и в самолетен режим — 3 през нощта, на село, в планината. 📴'],
    ['Къде отиват записките и снимките ми?', 'Никъде. Всичко живее само на твоя телефон — ние не го виждаме и не го изпращаме. Има и резервно копие с един бутон. 🔒'],
    ['Замества ли лекар?', 'Не — и никога няма да се преструва. Помага ти да разбереш КОГА е за лекар, а „Бележката за прегледа“ те праща там подготвена. 🩺'],
    ['Как го слагам на телефона?', 'Две докосвания: отваряш линка → „Добави на началния екран“. Без магазини, без регистрации, без пароли. 📲'],
    ['За кого е?', 'От „чакаме бебе!“ до първите години. И за тати има място (писмата между вас 💌), и за баба (готова картичка с всичко важно 😄).'],
    ['За кого е? (вариантът за „Сама съм“)', 'От „чакаме бебе!“ до първите години — за теб преди всичко. И за хората, които ви обичат: готова картичка за баба с всичко важно 😄, писма, които се пазят за после 💌.'],
    ['Ако сменя телефона — губя ли всичко?', 'Не, ако си направила копие. В „Инструменти“ има бутон <strong>💾 Резервно копие</strong> — сваля един файл с всичко: дневника, снимките, записките. На новия телефон отваряш приложението и го качваш обратно. <br><small>Ключалката на дневника не пътува с файла — на новия телефон си слагаш нова.</small>'],
    ['Кой вижда какво пиша тук?', 'Никой. Няма сървър, няма регистрация, няма изпращане. Всичко живее в паметта на този браузър, на този телефон. Дори шрифтовете са вътре в приложението — то не се свързва с нищо и с никого. Затова и работи офлайн.'],
    ['Ако изтрия приложението?', 'Данните си отиват с него — точно защото са само тук, а не при нас. Затова: направи си копие ПРЕДИ да триеш. Файлът остава при теб, дори приложението да го няма.']
  ];

  const списък = document.getElementById('списък');
  const редове = [];
  let прелели = 0;

  // таванът се ЧЕТЕ от css, не се преписва тук — ако собственикът го
  // смени, мерачът ще каже новото число.
  const пробен = document.createElement('div');
  пробен.className = 'faq-item open';
  пробен.innerHTML = '<div class="faq-a"><p>x</p></div>';
  списък.appendChild(пробен);
  const ТАВАН = parseFloat(getComputedStyle(пробен.querySelector('.faq-a')).maxHeight);
  списък.innerHTML = '';

  for (const [в, о] of ЧЗВ) {
    const item = document.createElement('div');
    item.className = 'faq-item open';         // отворено състояние
    item.innerHTML = '<button type="button" class="faq-q">' + в +
                     '<span class="faq-arr">▾</span></button>' +
                     '<div class="faq-a"><p>' + о + '</p></div>';
    списък.appendChild(item);
    const кутия = item.querySelector('.faq-a');
    const текст = item.querySelector('.faq-a p');
    // истинската нужна височина = височината на <p> (max-height реже кутията)
    const нужна = текст.getBoundingClientRect().height;
    const реже = нужна > ТАВАН + 0.5;
    if (реже) прелели++;
    редове.push('  ' + (реже ? '🔴' : '🟢') + ' нужни ' +
                String(Math.round(нужна)).padStart(4) + 'px' +
                (реже ? '  РЕЖЕ ' + Math.round(нужна - ТАВАН) + 'px' : '            ') +
                '  ' + в);
  }

  document.getElementById('изход').textContent =
    'ШИРИНА: 320px (тесен телефон) · ТАВАН .faq-a: ' + ТАВАН + 'px · overflow: hidden, без скрол\n\n' +
    редове.join('\n') +
    '\n\nОТРЯЗАНИ ОТГОВОРА: ' + прелели + ' от ' + ЧЗВ.length;
  window.__ЧЗВ = { таван: ТАВАН, прелели, общо: ЧЗВ.length };
})();
</script>
