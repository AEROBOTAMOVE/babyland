# ═══════════════════════════════════════════════════════════════════════
# Бейби Ленд · Netlify
#
# ЗАЩО ИМА СГЛОБЯВАНЕ, А НЕ „публикувай корена":
#   Хранилището носи 245 файла в dev/ (пазачи, корпуси, сонди) и още в qa/.
#   Те са безценни за работата и нямат какво да правят на живия сайт.
#   build.js прави dist/ САМО от приложението и сверява, че всеки път в
#   index.html наистина съществува — пакет със счупен път е бял екран.
#
# НУЛА ЗАВИСИМОСТИ: build.js е чист node, без npm install.
# ПЪТ НАЗАД: махни [build] и сложи publish = "." — сайтът пак тръгва,
#   само че с всичко вътре.
# ═══════════════════════════════════════════════════════════════════════

[build]
  command = "node build.js"
  publish = "dist"

# 21.10 · достъп · @netlify/database 2.x (функциите в netlify/functions) иска Node >= 22.12 — затова 22.
#   build.js е чист node и тръгва и на 22. ПЪТ НАЗАД: NODE_VERSION = "20".
[build.environment]
  NODE_VERSION = "22"

# 21.10 · достъп · регистрация, вход, админ (netlify/functions/*.mjs, всяка с config.path /api/...).
#   Профилите са в Netlify Database; таблиците се правят от netlify/database/migrations/.
#   Обяснението за собственика: netlify/README_BG.md.
#   ПЪТ НАЗАД: махни този блок, двата блока долу с «21.10 · достъп», package.json и папката netlify/.
[functions]
  directory = "netlify/functions"

# 21.10 · достъп · колан и тиранти: ако някой ден publish стане ".", папката netlify/ да е 404 (като AERO).
#   Днес netlify/ изобщо не влиза в dist/ (build.js копира само бял списък).
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Заглавките се пишат от build.js в dist/_headers, за да стоят до кода,
# който ги обяснява. Тук е само това, което Netlify не чете оттам.

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 21.10 · достъп · отговорите на /api никога не се кешират (функциите и сами пращат no-store + Vary: *).
#   Низовете са в ЕДИНИЧНИ кавички нарочно: dev/dzhamp_pazach.js сверява всеки двоен-кавичен „for“ с .htaccess на
#   Джъмп, а на Джъмп (LiteSpeed, само статични файлове) /api изобщо няма — паритет там няма какво да пази.
#   ПЪТ НАЗАД: махни тези 4 реда.
[[headers]]
  for = '/api/*'
  [headers.values]
    Cache-Control = 'no-store'

# ⚠️ НЕ слагай тук пренасочване „/* → /index.html". То е в dist/_redirects,
#   за да важи САМО когато няма файл на този път — иначе липсващ ресурс се
#   маскира като успешна страница и дефектът става невидим.
